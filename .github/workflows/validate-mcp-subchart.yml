name: Validate mcp-kubecost subchart

on:
  pull_request:
    paths:
      - 'kubecost/Chart.yaml'
      - 'kubecost/Chart.lock'
      - 'kubecost/values.yaml'
      - 'kubecost/templates/_helpers.tpl'
      - 'kubecost/templates/NOTES.txt'
      - 'kubecost/templates/frontend/_helpers.tpl'
      - 'kubecost/templates/frontend/frontend-configmap.yaml'
      - '.github/scripts/validate_mcp_subchart.sh'
      - '.github/workflows/validate-mcp-subchart.yml'
  workflow_dispatch: {}

# Prevents multiple runs of the same workflow on the same branch from executing
# simultaneously. Saves resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART_DIR: kubecost

jobs:
  validate-mcp-subchart:
    name: Lint, render, and check global inheritance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      # ubuntu-latest ships yq, but pin it so assertion syntax cannot drift
      # when the runner image is updated.
      - name: Set up yq
        run: |
          set -euo pipefail
          YQ_VERSION=v4.53.4
          curl -fsSL -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Add chart repositories
        run: |
          set -euo pipefail
          helm repo add finops-agent-chart https://kubecost.github.io/finops-agent-chart
          helm repo add mcp-kubecost https://kubecost.github.io/mcp-kubecost
          helm repo update

      # Resolves both dependencies from Chart.lock. This fails loudly if
      # Chart.lock is out of sync with Chart.yaml, or if the pinned
      # mcp-kubecost version is not published yet.
      - name: Build chart dependencies
        run: helm dependency build "$CHART_DIR"

      # helm lint with the subchart enabled, helm template for the default and
      # enabled cases, resource assertions, and the global: conformance checks.
      - name: Validate mcp-kubecost subchart integration
        env:
          MCP_SUBCHART_SKIP_DEP_BUILD: "1"
        run: .github/scripts/validate_mcp_subchart.sh "$CHART_DIR"

      - name: Render charts for schema validation
        run: |
          set -euo pipefail
          mkdir -p .helm-render
          # Default: mcp.enabled unset, aggregator.enabled=true (default) — MCP follows aggregator
          helm template kubecost "$CHART_DIR" \
            --skip-schema-validation \
            > .helm-render/mcp-default.yaml
          # Explicit mcp.enabled=true (backwards-compat / external aggregator path)
          helm template kubecost "$CHART_DIR" \
            --skip-schema-validation \
            --set mcp.enabled=true \
            > .helm-render/mcp-enabled.yaml
          # aggregator.enabled=false, mcp.enabled unset — MCP must be absent
          helm template kubecost "$CHART_DIR" \
            --skip-schema-validation \
            --set aggregator.enabled=false \
            > .helm-render/aggregator-off.yaml
          # aggregator.enabled=false, mcp.enabled=true — explicit override (external aggregator)
          helm template kubecost "$CHART_DIR" \
            --skip-schema-validation \
            --set aggregator.enabled=false \
            --set mcp.enabled=true \
            > .helm-render/mcp-forced-on.yaml
          helm template kubecost "$CHART_DIR" \
            --skip-schema-validation \
            --set mcp.enabled=true \
            --set mcp.httpRoute.enabled=true \
            --set mcp.httpRoute.parentRefs[0].name=mcp-gateway \
            --set mcp.httpRoute.hostnames[0]=mcp.example.com \
            --set mcp.config.authMode=open \
            --set mcp.config.kubecostApiKey.existingSecret=kubecost-api-key \
            --set global.platforms.cicd.enabled=true \
            --set global.platforms.cicd.skipSanityChecks=true \
            > .helm-render/mcp-httproute.yaml
          helm template kubecost "$CHART_DIR" \
            --skip-schema-validation \
            --set mcp.enabled=true \
            --set mcp.httpRoute.enabled=true \
            --set mcp.httpRoute.parentRefs[0].name=mcp-gateway \
            --set mcp.httpRoute.hostnames[0]=mcp.example.com \
            --set mcp.config.authMode=open \
            > .helm-render/mcp-httproute-open.yaml

      - name: Create KinD cluster
        uses: helm/kind-action@v1.15.0
        with:
          version: v0.31.0
          node_image: kindest/node:v1.34.3
          kubectl_version: v1.34.3

      # Validate every rendered resource against the KinD API server.
      - name: Validate (default render — MCP follows aggregator.enabled)
        run: kubectl create --dry-run=server --validate=strict -f .helm-render/mcp-default.yaml

      - name: Validate (core resources — mcp.enabled=true)
        run: kubectl create --dry-run=server --validate=strict -f .helm-render/mcp-enabled.yaml

      - name: Validate (aggregator.enabled=false — MCP absent)
        run: kubectl create --dry-run=server --validate=strict -f .helm-render/aggregator-off.yaml

      - name: Validate (aggregator.enabled=false, mcp.enabled=true — explicit override)
        run: kubectl create --dry-run=server --validate=strict -f .helm-render/mcp-forced-on.yaml

      # The Gateway API CRDs aren't installed, so skip the HTTPRoute.
      - name: Validate (HTTPRoute render)
        run: |
          set -euo pipefail
          yq 'select(.kind != "HTTPRoute")' .helm-render/mcp-httproute.yaml \
            | kubectl create --dry-run=server --validate=warn -f -

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mcp-subchart-renders
          path: .helm-render/
          if-no-files-found: warn

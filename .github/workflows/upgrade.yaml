# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Helm upgrade

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 22 * * 4' # Every Thursday at 10:30 PM

env:
  CHART_REPO: kubecost
  CHART_REPO_URL: https://kubecost.github.io/kubecost/
  CHART_NAME: kubecost

jobs:
  discover-versions:
    runs-on: ubuntu-latest
    outputs:
      versionmatrix: ${{ steps.versions.outputs.versions }}

    steps:
      - name: Discover versions
        id: versions
        run: |
          ## Find the latest published version of the chart and the newest
          ## patch of the preceding minor.
          set -euo pipefail

          helm repo add "$CHART_REPO" "$CHART_REPO_URL"
          helm repo update

          ALL=$(helm search repo "$CHART_REPO/$CHART_NAME" -l -o json \
                | jq -r --arg n "$CHART_REPO/$CHART_NAME" '.[] | select(.name==$n) | .version')

          LATEST=$(echo "$ALL" | head -n1)

          if [ -z "$LATEST" ]; then
              echo "Latest version is empty when it shouldn't be. Something is wrong. Failing."
              exit 1
          fi

          VERSIONS=$(jq -cn --arg v "$LATEST" '[$v]')

          LATEST_MINOR=$(echo "$LATEST" | cut -d. -f1,2)
          PREVIOUS_MINOR=$(echo "$ALL" | cut -d. -f1,2 | sort -Vu | grep -vx "$LATEST_MINOR" | tail -n1 || true)

          if [ -n "$PREVIOUS_MINOR" ]; then
              PREVIOUS=$(echo "$ALL" | grep "^${PREVIOUS_MINOR}\." | head -n1)
              VERSIONS=$(echo "$VERSIONS" | jq --arg v "$PREVIOUS" '. += [$v]')
          else
              echo "No previous minor available, only $LATEST_MINOR."
          fi

          echo Test matrix is $VERSIONS

          echo "versions=$(jq -cn --argjson versions "$VERSIONS" '{target: $versions}')" >> $GITHUB_OUTPUT

  upgrade-chart:
    runs-on: ubuntu-latest
    needs: discover-versions
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-versions.outputs.versionmatrix) }}
    name: ${{ matrix.target }} upgrade test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create KinD cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.31.0
          node_image: kindest/node:v1.36.4
          kubectl_version: v1.36.4

      # Install the published chart with default values and check results.
      - name: Install Kubecost chart
        run: |
          helm repo add "$CHART_REPO" "$CHART_REPO_URL"
          helm repo update
          helm install --wait --wait-for-jobs kubecost "$CHART_REPO/$CHART_NAME" -n kubecost --create-namespace --version ${{ matrix.target }}

      - name: Wait for ready
        run: kubectl wait -n kubecost --for=condition=ready pod --selector app.kubernetes.io/instance=kubecost --timeout=300s

      - name: Run Helm tests
        run: helm test -n kubecost kubecost

      # Subcharts are not vendored into the repo, so they have to be fetched
      # before the working copy of the chart can be rendered.
      - name: Build chart dependencies
        run: |
          helm repo add finops-agent-chart https://kubecost.github.io/finops-agent-chart
          helm repo add mcp-kubecost https://kubecost.github.io/mcp-kubecost
          helm repo update
          helm dependency build ./kubecost

      - name: Upgrade to current working version
        run: helm upgrade kubecost -n kubecost ./kubecost --wait --wait-for-jobs

      - name: Wait for ready
        run: |
          kubectl wait -n kubecost --for=condition=ready pod --selector app.kubernetes.io/instance=kubecost --timeout=300s
          kubectl -n kubecost get pods

      - name: Run Helm tests post-upgrade
        run: helm test -n kubecost kubecost

      - name: gather debug info
        if: failure()
        run: |
          kubectl -n kubecost get pods
          kubectl -n kubecost describe pods
          kubectl -n kubecost logs -l app.kubernetes.io/instance=kubecost --all-containers --tail=200

name: Label Checker
on:
    pull_request:
        branches:
            - develop
        types:
            - opened
            - synchronize
            - reopened
            - labeled
            - unlabeled
    merge_group:
      types: [checks_requested]

jobs:
  check_labels:
    name: Check labels
    runs-on: ubuntu-latest
    steps:
      - name: Generate an app token with permissions to clone cross-repo
        id: generate-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KC_ACTIONS_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KC_ACTIONS_BOT_APP_PRIVATE_KEY }}
          owner: kubecost
          repositories: github-actions

      - name: Check out actions code
        uses: actions/checkout@v7
        with:
          repository: kubecost/github-actions
          path: ./github-actions
          ref: main
          token: ${{ steps.generate-app-token.outputs.token }}

      - id: check-labels
        uses: ./github-actions/github-action-required-labels
        with:
          mode: minimum
          count: 1
          add_comment: true
          message: "This PR requires a version label that you want the PRd feature to be released in, in the form of vMAJOR.MINOR"
          use_regex: true
          labels: | 
              ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)
              dependencies

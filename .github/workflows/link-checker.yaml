name: Check Links

on:
  repository_dispatch:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
  schedule:
    - cron: "0 0 * * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KC_ACTIONS_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KC_ACTIONS_BOT_APP_PRIVATE_KEY }}
          owner: kubecost
          repositories: github-actions

      - name: Checkout github-actions
        uses: actions/checkout@v6
        with:
          repository: kubecost/github-actions
          token: ${{ steps.app-token.outputs.token }}
          path: .github-actions
          sparse-checkout: lychee-action

      ## Recursively check all markdown and yaml files for broken links
      ## Ref: https://github.com/lycheeverse/lychee#commandline-parameters
      - name: Link Checker
        id: lychee
        uses: ./.github-actions/lychee-action
        with:
          fail: true
          debug: false
          args: --verbose --include-fragments --no-progress --exclude-path '.github-actions' -E './**/*.md' './**/*.yaml' './**/*.yml'

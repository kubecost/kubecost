version: 2
registries:
  # values.yaml images with `registry: null` default to icr.io at render time
  icr:
    type: docker-registry
    url: https://icr.io
    replaces-base: true
updates:
  # GitHub Actions - Monthly updates to reduce update frequency
  # Provides time for community feedback before adopting new action versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: "monday"
    rebase-strategy: disabled
    labels:
      - "dependencies"
      - "github-actions"

  # Docker images - Daily updates for Kubecost-owned container images
  - package-ecosystem: docker
    directory: /kubecost
    registries:
      - icr
    schedule:
      interval: daily
    ignore:
      # Docker Hub image; not resolvable once icr.io replaces the base registry
      - dependency-name: bitnami/kubectl
    rebase-strategy: disabled
    labels:
      - "dependencies"
      - "docker"

  # Helm chart dependencies - Daily updates for finops-agent subchart
  # Monitors the finops-agent dependency in Chart.yaml
  - package-ecosystem: helm
    directory: /kubecost
    schedule:
      interval: daily
    ignore:
      # Skip values.yaml images: their registry is set at render time, and tag bumps drop the "v" prefix
      - dependency-name: "*/*"
    rebase-strategy: disabled
    labels:
      - "dependencies"
      - "helm"
      - "finops-agent"

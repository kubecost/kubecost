{{- if .Values.networkCosts -}}
{{- if .Values.networkCosts.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ template "kubecost.networkCosts.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubecost.networkCosts.commonLabels" . | nindent 4 }}
    {{- if .Values.networkCosts.additionalLabels }}
    {{- toYaml .Values.networkCosts.additionalLabels | nindent 4 }}
    {{- end }}
  annotations:
  {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.networkCosts.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.networkCosts.updateStrategy }}
  updateStrategy:
    {{- toYaml .Values.networkCosts.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kubecost.networkCosts.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.global.podAnnotations}}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.networkCosts.annotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kubecost.networkCosts.commonLabels" . | nindent 8 }}
        {{- if .Values.networkCosts.additionalLabels }}
        {{- toYaml .Values.networkCosts.additionalLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- include "kubecost.imagePullSecrets" . | nindent 6 }}
      hostNetwork: true
      serviceAccountName: {{ template "kubecost.networkCosts.name" . }}
      {{- $acctFile := "/netfilter/nf_conntrack_acct" }}
      {{- if .Values.networkCosts.hostProc }}
      {{- $acctFile = printf "%s/sys/net/netfilter/nf_conntrack_acct" .Values.networkCosts.hostProc.mountPath }}
      {{- end }}
      # See notes in values.yaml for context
      initContainers:
      {{- if .Values.networkCosts.sysctlInit.enabled }}
      - name: sysctl
        image: {{ include "kubecost.networkCosts.image" . }}
        imagePullPolicy: {{ .Values.networkCosts.imagePullPolicy | default "Always" }}
        ## Written via procfs rather than `sysctl -w`: the network-costs image is
        ## minimal and does not ship the procps sysctl binary.
        command:
        - /bin/sh
        - -c
        - |
          set -e
          f=/proc/sys/net/netfilter/nf_conntrack_acct
          if [ ! -w "$f" ]; then
            echo "ERROR: $f is not writable. Is the nf_conntrack kernel module loaded on this node?" >&2
            exit 1
          fi
          echo 1 > "$f"
          echo "net.netfilter.nf_conntrack_acct=$(cat "$f")"
        securityContext:
          # Required to write host kernel sysctl; CAP_NET_ADMIN alone is not sufficient.
          # Note: allowPrivilegeEscalation cannot be set to false when privileged is true.
          privileged: true
          runAsUser: 0
      {{- else }}
      ## sysctlInit is disabled, so the sysctl is expected to be applied out of
      ## band (machine config, tuned profile, node bootstrap). Verify it and fail
      ## fast rather than let network-costs report zero egress bytes silently.
      ## This container needs no privileges at all: nf_conntrack_acct is
      ## world-readable (0644 root:root). It must run in the host network
      ## namespace — the value is per-netns, so a pod-local read returns the
      ## namespace default of 0 — which it inherits from the pod's hostNetwork.
      - name: sysctl-verify
        image: {{ include "kubecost.networkCosts.image" . }}
        imagePullPolicy: {{ .Values.networkCosts.imagePullPolicy | default "Always" }}
        command:
        - /bin/sh
        - -c
        - |
          f={{ $acctFile }}
          v=$(cat "$f" 2>/dev/null || echo "")
          if [ "$v" != "1" ]; then
            echo "ERROR: net.netfilter.nf_conntrack_acct is '$v', expected '1' (read from $f)." >&2
            echo "network-costs cannot attribute egress bytes to pods without it." >&2
            echo "Either set the sysctl on every node, or re-enable the sysctlInit container" >&2
            echo "to automatically set it --set networkCosts.sysctlInit.enabled=true" >&2
            exit 1
          fi
          echo "net.netfilter.nf_conntrack_acct=$v"
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        volumeMounts:
        {{- if .Values.networkCosts.hostProc }}
        - mountPath: {{ .Values.networkCosts.hostProc.mountPath }}
          name: host-proc
          readOnly: true
        {{- else }}
        - mountPath: /netfilter
          name: netfilter
          readOnly: true
        {{- end }}
      {{- end }}
      containers:
      - name: {{ template "kubecost.networkCosts.name" . }}
        {{- if eq (typeOf .Values.networkCosts.image) "string" }}
        image: {{ .Values.networkCosts.image }}
        {{- else }}
        image: {{ include "kubecost.networkCosts.image" . }}
        {{- end}}
        {{- if .Values.networkCosts.extraArgs }}
        args:
          {{- toYaml .Values.networkCosts.extraArgs | nindent 8 }}
        {{- end }}
{{- if .Values.networkCosts.imagePullPolicy }}
        imagePullPolicy: {{ .Values.networkCosts.imagePullPolicy }}
{{- else }}
        imagePullPolicy: Always
{{- end }}
{{- if .Values.networkCosts.resources }}
        resources: {{- toYaml .Values.networkCosts.resources | nindent 10 }}
{{- end }}
        env:
        {{- if .Values.networkCosts.hostProc }}
        - name: HOST_PROC
          value: {{ .Values.networkCosts.hostProc.mountPath }}
        {{- end }}
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: ELECTION_NAMESPACE
          value: {{ .Release.Namespace }}
        - name: HOST_PORT
          value: {{ (quote .Values.networkCosts.port) | default (quote 3001) }}
        - name: TRAFFIC_LOGGING_ENABLED
          value: {{ (quote .Values.networkCosts.trafficLogging) | default (quote true) }}
        - name: LOG_LEVEL
          value: {{ .Values.networkCosts.logLevel }}
        - name: USE_LEADER_KUBERNETES_WATCHERS
          value: {{ (quote .Values.networkCosts.leaderKubernetesWatcher) }}
        - name: USE_HOST_NODE_NETWORK_MAP
          value: {{ (quote .Values.networkCosts.hostNodeNetworkMap) }}
        - name: ROUTE_REFRESH_INTERVAL
          value: {{ (quote .Values.networkCosts.routeRefreshInterval) }}
        - name: CONNTRACK_REFRESH_INTERVAL
          value: {{ (quote .Values.networkCosts.conntrackRefreshInterval) }}
        {{- if .Values.networkCosts.storageConfig }}
        - name: STORAGE_CONFIG_PATH
          value: /network-costs/secret/storage.yaml
        {{- else if or (.Values.global.federatedStorage).config (.Values.global.federatedStorage).existingSecret }}
        - name: STORAGE_CONFIG_PATH
          value: /network-costs/federated-store/{{ include "kubecost.federatedStorage.fileName" . }}
        {{- end }}
        {{- if .Values.networkCosts.natGatewayConfig }}
        - name: NAT_GATEWAY_CONFIG_PATH
          value: /network-costs/secret/nat-gateway.yaml
        {{- end }}
        {{- if .Values.networkCosts.healthCheckProbes }}
        {{- toYaml .Values.networkCosts.healthCheckProbes | nindent 8 }}
        {{- end }}
        volumeMounts:
        ## These mounts must stay writable. network-costs re-enables conntrack
        ## accounting itself if it finds nf_conntrack_acct set to 0 at startup,
        ## and mounting the sysctl read-only turns that self-heal into a
        ## crashloop ("Failed to enable conntrack byte/packet accounting ...
        ## Read-only file system"). The sysctlInit container normally sets the
        ## value first, but init containers are not re-run when the main
        ## container restarts, so this path still matters if the value is
        ## changed on the node while the pod is alive.
        {{- if .Values.networkCosts.hostProc }}
        - mountPath: {{ .Values.networkCosts.hostProc.mountPath }}
          name: host-proc
        {{- else }}
        ## /net is host /proc/net, which network-costs only ever reads.
        - mountPath: /net
          name: nf-conntrack
          readOnly: true
        - mountPath: /netfilter
          name: netfilter
        {{- end }}
        {{- if .Values.networkCosts.config }}
        - mountPath: /network-costs/config
          name: network-costs-config
        {{- end }}
        {{- if or .Values.networkCosts.storageConfig .Values.networkCosts.natGatewayConfig }}
        - mountPath: /network-costs/secret
          name: network-costs-secret
          readOnly: true
        {{- end }}
        {{- if and (not .Values.networkCosts.storageConfig) (or (.Values.global.federatedStorage).config (.Values.global.federatedStorage).existingSecret) }}
        - mountPath: /network-costs/federated-store
          name: network-costs-federated-store
          readOnly: true
        {{- end }}
        {{- if .Values.networkCosts.securityContext }}
        securityContext:
          {{- toYaml .Values.networkCosts.securityContext | nindent 10 }}
        {{- end }}
        ports:
        - name: http-server
          containerPort: {{ .Values.networkCosts.port | default 3001 }}
          hostPort: {{ .Values.networkCosts.port | default 3001 }}
{{- if .Values.networkCosts.priorityClassName }}
      priorityClassName: "{{ .Values.networkCosts.priorityClassName }}"
{{- end }}
      {{- with .Values.networkCosts.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 10 }}
      {{- end }}
{{- if .Values.networkCosts.tolerations }}
      tolerations:
{{ toYaml .Values.networkCosts.tolerations | indent 8 }}
    {{- end }}
      affinity:
        {{- toYaml .Values.networkCosts.affinity | nindent 8 }}
      volumes:
      {{- if .Values.networkCosts.config }}
      - name: network-costs-config
        configMap:
          name: network-costs-config
      {{- end }}
      {{- if or .Values.networkCosts.storageConfig .Values.networkCosts.natGatewayConfig }}
      - name: network-costs-secret
        secret:
          secretName: network-costs-secret
      {{- end }}
      {{- if and (not .Values.networkCosts.storageConfig) (or (.Values.global.federatedStorage).config (.Values.global.federatedStorage).existingSecret) }}
      - name: network-costs-federated-store
        secret:
          secretName: {{ include "kubecost.federatedStorage.secretName" . | trim }}
      {{- end }}
      {{- if .Values.networkCosts.hostProc }}
      - name: host-proc
        hostPath:
          path: {{ default "/proc" .Values.networkCosts.hostProc.hostPath }}
      {{- else }}
      - name: nf-conntrack
        hostPath:
          path: /proc/net
      - name: netfilter
        hostPath:
          path: /proc/sys/net/netfilter
      {{- end }}
{{- end }}
{{- end }}

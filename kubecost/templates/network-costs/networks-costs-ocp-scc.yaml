{{- if and (.Capabilities.APIVersions.Has "security.openshift.io/v1/SecurityContextConstraints") (.Values.global.platforms.openshift.scc.networkCosts) (.Values.networkCosts.enabled) }}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ template "kubecost.networkCosts.name" . }}
  labels:
    {{- include "kubecost.commonLabels" . | nindent 4 }}
priority: 10
{{- $sc := .Values.networkCosts.securityContext | default dict }}
{{- $caps := $sc.capabilities | default dict }}
# Privileged and capabilities are sourced from networkCosts.securityContext so
# the SCC stays aligned with the DaemonSet container (NET_ADMIN for ctnetlink).
allowPrivilegedContainer: {{ dig "privileged" false $sc }}
{{- with $caps.drop }}
requiredDropCapabilities:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with $caps.add }}
allowedCapabilities:
  {{- toYaml . | nindent 2 }}
{{- end }}
allowHostDirVolumePlugin: true
allowHostNetwork: true
allowHostPorts: true
allowHostPID: false
allowHostIPC: false
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
fsGroup:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
- runtime/default
volumes:
  - hostPath
  - projected
  - configMap
  - secret
users:
  - system:serviceaccount:{{ .Release.Namespace }}:{{ template "kubecost.networkCosts.name" . }}
{{- end }}
